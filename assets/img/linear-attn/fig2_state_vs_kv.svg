<text x="540.0" y="410.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">不可回滚 → 整段 snapshot + copy-on-write + 尾部重放</text>
<text x="540.0" y="432.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">conv state / normalizer z / SSM state 同样是每层固定状态</text>
<text x="500.0" y="478.0" font-size="12" fill="#0f766e" text-anchor="middle" font-weight="600">交叉点 T<tspan baseline-shift="super" font-size="0.72em">*</tspan> = n<tspan baseline-shift="sub" dy="-0.16em" font-size="0.72em">h</tspan> d / (2 n<tspan baseline-shift="sub" dy="-0.16em" font-size="0.72em">kv</tspan>)：GQA 4:1、d=128 时是 256 token</text>
