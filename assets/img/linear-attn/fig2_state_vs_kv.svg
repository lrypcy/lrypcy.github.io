<text x="240.0" y="324.0" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="normal">→ 追加，不覆盖</text>
<text x="62.0" y="348.0" font-size="12" fill="#6b7280" text-anchor="start" font-weight="normal">… 一直到第 T 个 token</text>
<text x="40.0" y="386.0" font-size="13" fill="#dc2626" text-anchor="start" font-weight="600">2 n<tspan baseline-shift="sub" dy="-0.16em" font-size="0.72em">kv</tspan> d T b  字节（随 T 线性增长）</text>
<text x="40.0" y="410.0" font-size="12" fill="#1f2937" text-anchor="start" font-weight="normal">前缀只读 → 按 block 哈希复用，可任意 fork</text>
<text x="40.0" y="432.0" font-size="11" fill="#6b7280" text-anchor="start" font-weight="normal">DeepSeek-V2 Table 1：GQA 2 n<tspan baseline-shift="sub" dy="-0.16em" font-size="0.72em">g</tspan> d<tspan baseline-shift="sub" dy="-0.16em" font-size="0.72em">h</tspan> l，MLA (d<tspan baseline-shift="sub" dy="-0.16em" font-size="0.72em">c</tspan>+d<tspan baseline-shift="sub" dy="-0.16em" font-size="0.72em">h</tspan><tspan baseline-shift="super" font-size="0.72em">R</tspan>) l</text>
<text x="528.0" y="96.0" font-size="15" fill="#2563eb" text-anchor="start" font-weight="600">linear attention：状态是一份矩阵，不是历史</text>
