<text x="28" y="34" font-size="20" font-weight="600" fill="#1f2937">同样叫「缓存」，两种对象的形状完全不同</text>
<text x="28" y="56" font-size="12.5" fill="#6b7280">左：逐 token 的只读历史；右：固定形状、被就地覆盖的矩阵状态</text>
