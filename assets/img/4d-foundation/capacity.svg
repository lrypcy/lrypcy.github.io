<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 336" width="680" height="336" role="img" font-family="PingFang SC, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="680" height="336" fill="#ffffff"/>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- left panel -->
  <rect x="16" y="10" width="316" height="212" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2"/>
  <text x="174" y="32" font-size="11.5" font-weight="700" text-anchor="middle" fill="#b91c1c">允许 query 之间互看：实测掉点</text>

  <rect x="34" y="76" width="60" height="112" rx="7" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="64" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">F</text>
  <text x="64" y="146" font-size="9" text-anchor="middle" fill="#475569">全局表征</text>

  <rect x="168" y="78" width="104" height="26" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.1"/>
  <text x="220" y="95" font-size="10.5" text-anchor="middle" fill="#111827">query q₁</text>
  <rect x="168" y="119" width="104" height="26" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.1"/>
  <text x="220" y="136" font-size="10.5" text-anchor="middle" fill="#111827">query q₂</text>
  <rect x="168" y="160" width="104" height="26" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.1"/>
  <text x="220" y="177" font-size="10.5" text-anchor="middle" fill="#111827">query q₃</text>

  <line x1="168" y1="91" x2="98" y2="110" stroke="#059669" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="168" y1="132" x2="98" y2="132" stroke="#059669" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="168" y1="173" x2="98" y2="154" stroke="#059669" stroke-width="1.3" marker-end="url(#ar2)"/>

  <line x1="292" y1="91" x2="292" y2="173" stroke="#b91c1c" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="286" y1="91" x2="298" y2="91" stroke="#b91c1c" stroke-width="1.3"/>
  <line x1="286" y1="173" x2="298" y2="173" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="306" y="128" font-size="13" font-weight="700" fill="#b91c1c">×</text>
  <text x="174" y="207" font-size="10" text-anchor="middle" fill="#b91c1c">从邻居抄答案 → 几何不必写进 F</text>

  <!-- right panel -->
  <rect x="348" y="10" width="316" height="212" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
  <text x="506" y="32" font-size="11.5" font-weight="700" text-anchor="middle" fill="#047857">query 各自冷启动：几何全压在 F 上</text>

  <rect x="366" y="76" width="60" height="112" rx="7" fill="#ffffff" stroke="#111827" stroke-width="1.3"/>
  <text x="396" y="126" font-size="15" font-weight="700" text-anchor="middle" fill="#111827">F</text>
  <text x="396" y="146" font-size="9" text-anchor="middle" fill="#475569">全局表征</text>

  <rect x="500" y="78" width="104" height="26" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.1"/>
  <text x="552" y="95" font-size="10.5" text-anchor="middle" fill="#111827">query q₁</text>
  <rect x="500" y="119" width="104" height="26" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.1"/>
  <text x="552" y="136" font-size="10.5" text-anchor="middle" fill="#111827">query q₂</text>
  <rect x="500" y="160" width="104" height="26" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1.1"/>
  <text x="552" y="177" font-size="10.5" text-anchor="middle" fill="#111827">query q₃</text>

  <line x1="500" y1="91" x2="430" y2="110" stroke="#059669" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="500" y1="132" x2="430" y2="132" stroke="#059669" stroke-width="1.3" marker-end="url(#ar2)"/>
  <line x1="500" y1="173" x2="430" y2="154" stroke="#059669" stroke-width="1.3" marker-end="url(#ar2)"/>

  <text x="506" y="207" font-size="10" text-anchor="middle" fill="#047857">表征必须自足 → 容量前移到编码器</text>

  <!-- capacity bar -->
  <text x="340" y="252" font-size="11" text-anchor="middle" fill="#111827">参数量分配（D4RT 主实验配置）</text>

  <rect x="40" y="262" width="524" height="26" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="302" y="279" font-size="10.5" text-anchor="middle" fill="#065f46">编码器 ≈ 1B（ViT-g，40 层）</text>
  <rect x="564" y="262" width="76" height="26" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="602" y="279" font-size="10" text-anchor="middle" fill="#1e40af">144M</text>
  <text x="602" y="302" font-size="9" text-anchor="middle" fill="#1e40af">解码器（8 层）</text>

  <text x="300" y="322" font-size="10.5" text-anchor="middle" fill="#475569">容量比 ≈ 7 : 1 —— 不是调出来的，是接口设计的后果</text>
</svg>
