# 首页「分类 × 知识图谱」的结构化数据
#
# 提交时会自动体检（发现未归系列的文章 / 未配置分类 / 孤立系列 / 建议补的依赖边 / 图谱节点重叠）：
#   python3 tools/graph_sync.py --links          # 完整报告
#   python3 tools/graph_sync.py --suggest-yml    # 打印可粘贴的 yml 片段
#   node tools/kg_layout_check.mjs               # 图谱布局体检（节点有没有叠在一起、有没有越界）
#   node tools/kg_preview.mjs                    # 生成离线预览 HTML，本地就能看图谱长什么样（不用等 GitHub Pages 构建）
# hook 安装：bash tools/install_hooks.sh（严格模式：GRAPH_SYNC_STRICT=1 git commit）
# ------------------------------------------------------------------
# categories : 分类元信息（图标 / 主题色 / 一句话定位），顺序即展示顺序
# series     : 系列（知识图谱里的节点）。用 prefixes 匹配 _posts 文件名，
#              新增文章只要文件名带对应前缀就会自动归入该系列。
#              exclude 用于排除误命中（如 compiler- 会命中 chip-for-ai-compiler-*）
#              node: false 表示只在「分类面板」里出现，不进图谱
# links      : 知识图谱的边（from 基础 → to 上层），label 为依赖关系说明
# paths      : 推荐学习路线（首页底部「学习路线」）
# ------------------------------------------------------------------

categories:
  - name: 模型量化
    icon: "🎯"
    color: "#2563eb"
    desc: 从 RTN/GPTQ/AWQ 的 PTQ，到 LSQ/PACT/DSQ 的 QAT，再到低比特部署与格式生态
  - name: 编译器技术
    icon: "🛠️"
    color: "#7c3aed"
    desc: 经典编译原理 → LLVM/GCC/TVM/MLIR → torch.compile / Triton 工程三件套
  - name: 算子开发
    icon: "⚙️"
    color: "#0891b2"
    desc: Roofline 建模、Kernel 语言三件套、Tiling/双缓冲优化与 GEMM/FlashAttention 实战
  - name: 强化学习
    icon: "🎮"
    color: "#e11d48"
    desc: MDP → 策略梯度 → TRPO/PPO → GRPO 的算法主干，下分四条支线：符号与估计器、Agentic RL、奖励的来源、训练栈
  - name: LLM算法
    icon: "🧩"
    color: "#d97706"
    desc: 位置编码与长度外推的完整谱系，以及 Test-Time Training 这条新主线
  - name: 芯片架构
    icon: "🖥️"
    color: "#0d9488"
    desc: 给 AI 编译器工程师的芯片课：从晶体管到 Tensor Core、脉动阵列与互连
  - name: 集群与容错
    icon: "🛡"
    color: "#b91c1c"
    desc: checkpoint 成本模型、故障恢复、调度语义与多租户隔离
  - name: 数据与存储
    icon: "📦"
    color: "#0369a1"
    desc: 数据切分的正确性、加载流水线的吞吐与长尾、shard 划分的统计含义
  - name: 分布式训练
    icon: "🚂"
    color: "#4f46e5"
    desc: DP / ZeRO / TP / PP / EP / SP 六种并行与集合通信的地基
  - name: 具身智能
    icon: "🤖"
    color: "#16a34a"
    desc: 控制地基、学习范式、感知操作、VLA 基础模型与产业版图的完整地图
  - name: 模型蒸馏
    icon: "🧪"
    color: "#db2777"
    desc: Dark Knowledge → On-Policy Distillation，蒸馏与 RL 的统一损失光谱
  - name: 生成模型
    icon: "🎨"
    color: "#ea580c"
    desc: 扩散模型全景与 Flow Matching 的算法演进、工业标准与应用落地
  - name: 性能分析
    icon: "📊"
    color: "#9333ea"
    desc: 从 nvidia-smi 到 Nsight Compute 的 NVIDIA 性能剖析工具链
  - name: 推理服务
    icon: "🚀"
    color: "#0f766e"
    desc: vLLM / SGLang 源码级对比：KV 缓存组织、调度与重叠、进程与故障边界，以及投机解码这条加速主线
  - name: 系统实现
    icon: "🔬"
    color: "#475569"
    desc: 框架内部实现的源码级走读：采样的 fast path、logprob 的五条路径与确定性复现，以及 Python 字节码 / Frame 与 Dynamo 图捕获
  - name: 深度学习
    icon: "🧠"
    color: "#0284c7"
    desc: 扩散模型等深度学习主干知识的系统性梳理
  - name: Agent技术剖析
    icon: "🕵️"
    color: "#7e22ce"
    desc: 拆开 coding agent 的真代码、真库、真文件：会话状态存在哪、上下文怎么压缩、工具与权限怎么表达、子代理怎么调度

series:
  # ---------- layer 0：硬件与系统底座 ----------
  - id: chip
    name: 给 AI 编译器工程师的芯片课
    short: 芯片架构
    category: 芯片架构
    layer: 0
    order: 0
    prefixes: [chip-for-ai-compiler-]
    desc: 10 讲。从沙子到流片、存储层次、ISA 与流水线、GPU 执行引擎、脉动阵列、互连与 Chiplet，最后落到协同设计与性能建模。

  - id: compiler
    name: 编译器知识体系深度解析
    short: 编译器体系
    category: 编译器技术
    layer: 0
    order: 1
    prefixes: [compiler-]
    exclude: [chip-for-ai, op-, xdsl]
    desc: 13 讲。词法语法 → 语义与 IR → 数据流分析与中端优化 → 后端代码生成，再逐个解剖 GCC / LLVM / TVM / XLA-MLIR / torch.compile。

  - id: op
    name: 算子开发与优化
    short: 算子开发
    category: 算子开发
    layer: 0
    order: 2
    prefixes: [op-]
    desc: 14 讲。Roofline 上界预判 → 硬件执行模型 → CUDA/Triton/Ascend C → Profiling 工具链 → 优化技术体系 → GEMM/Attention/卷积案例 → 国产 NPU 与编译器集成。

  - id: fault-tolerance
    name: 集群与容错
    short: 集群与容错
    category: 集群与容错
    layer: 0
    order: 7
    prefixes: [cluster-fault-tolerance-]
    desc: 多讲。01 checkpoint 成本模型（写开销与重算开销的对抗、闭式最优、异步写与分层检查点、周期性故障的最坏相位）→ 待写：调度语义与 gang scheduling、多租户隔离、弹性训练的重配成本。

  - id: data-pipeline
    name: 数据 pipeline
    short: 数据 pipeline
    category: 数据与存储
    layer: 0
    order: 3
    prefixes: [data-pipeline-]
    desc: 多讲。切分正确性（「不重不漏」的唯一定义粒度、分布偏斜、shard 是 cluster 不是样本）→ 加载流水线（worker 数的阶跃收益、独立长尾 vs 成片抖动、盈余与 prefetch 的真实作用）。

  - id: dist-train
    name: 分布式训练全景
    short: 分布式训练
    category: 分布式训练
    layer: 0
    order: 4
    prefixes: [dist-train-]
    desc: 9 讲。DP → ZeRO/FSDP → TP → PP → SP → EP，加上集合通信数学与 2D/3D 并行组合实战。

  - id: megatron
    name: Megatron-LM 深度剖析
    short: Megatron 源码
    category: 分布式训练
    layer: 0
    order: 5
    prefixes: [megatron-]
    desc: 14 篇。00 地基（代码地图与配置系统、一次迭代控制流）→ 01 进程组与通信/计算重叠 → 02 专家并行（进程组双表、token dispatch 全链路、负载均衡）→ 03–07 并行源码层（TP+SP / GTP / DP 与优化器三套实现 / PP 调度器 / CP 与长上下文）→ 08–10 优化工具箱（显存账本与重计算 / FP8 与 FP4 / 算子融合与 CUDA Graph）→ 11–13 延伸（原生 RL 与 Refit / Checkpoint 与容错 / Bridge 与导出）。承接 dist-train 系列的并行原理，只做源码层，补上 2026 新特性（GTP、MLA/DSA、MFSDP v2、Dynamic CP、full CUDA graph、原生 RL 栈）。实测与调优已外迁至性能剖析系列。

  - id: perf-analysis
    name: 性能剖析：度量口径、训练栈归因与服务测量
    short: 性能剖析
    category: 性能分析
    layer: 0
    order: 6
    prefixes: [profiling-]
    exclude: [nv-gpu-profiling, op-]
    desc: 3 篇。00 度量口径（MFU/HFU 分母、Timer 语义、goodput 边界）→ 01 训练栈 profiling（OTel / Perfetto / nsys 三层观测面、overlap 双分母、α-β 判据、掉队卡诊断）→ 02 推理服务 profiling（ITL 与 TPOT 的分母差、goodput 与峰值吞吐、closed/open loop、到达分布、前缀缓存陷阱）。承接 op 系列的工具链与 dist-train / Megatron 的栈知识，回答「这些数字是怎么算出来的、哪些彼此不可比」。

  - id: serving
    name: 推理引擎深度对比
    short: 推理引擎
    category: 推理服务
    layer: 0
    order: 6
    prefixes: [serving-]
    desc: 01 架构分歧的根（KV 缓存组织 / 调度重叠 / 进程与语言边界三条独立设计路线）→ 02 调度与批处理 → 03/04 支持矩阵 → 05 PD 分离 → 06 benchmark 交叉验证 → 07 选型手册 → 08 前缀命中率。取证基准 vLLM v0.31.0（commit db9527a4）/ SGLang v0.5.21（commit e00930c5），全部行号锁 commit 可点开核验；本机无 GPU，全系列不跑性能 benchmark，性能数字按可信度分级。

  # ---------- layer 1：核心算法 ----------
  - id: posem
    name: 大模型位置编码
    short: 位置编码
    category: LLM算法
    layer: 1
    order: 0
    prefixes: [posem-]
    desc: 8 讲。正余弦/可学习 → 相对位置 → RoPE → 长度外推（PI/NTK/YaRN/LongRoPE）→ ALiBi → 多模态 M-RoPE。

  - id: distill
    name: 模型蒸馏全景
    short: 模型蒸馏
    category: 模型蒸馏
    layer: 1
    order: 1
    prefixes: [distillation-, online-distillation, on-policy-distillation, opd-one-year, distill-rl-unified]
    exclude: [llm-quant]
    desc: 5 篇。Dark Knowledge 主线、在线蒸馏（MiniLLM/GKD）、On-Policy Distillation 深度剖析与一年后的生态现状，最后用统一损失光谱把 SFT / OPD / RLVR 串成一条谱系。

  - id: quant
    name: 大模型量化算法
    short: 大模型量化
    category: 模型量化
    layer: 1
    order: 2
    prefixes: [llm-quant-, ptq-, qat-]
    desc: 31 篇。00–25 主线 + E1–E5 扩展篇：量化器数学地基 → PTQ 全家桶 → QAT/可学习 scale → KV Cache、混合精度、部署生态、1-bit 前沿与部署侧算子融合。

  - id: mdp-grpo
    name: 从 MDP 到 GRPO
    short: MDP→GRPO
    category: 强化学习
    layer: 1
    order: 3
    prefixes: [mdp-to-grpo-]
    desc: 5 讲。MDP 与贝尔曼方程 → REINFORCE 与方差 → TRPO 信任域 → PPO 截断 → GRPO 组相对优势，一条完整的策略优化演进链。

  - id: ttt
    name: Test-Time Training 全景
    short: TTT
    category: LLM算法
    layer: 1
    order: 4
    prefixes: [ttt-]
    desc: 4 篇。两条主线划分、fast weights 到对偶形式的数学推导、LLM 推理增强与 chunk 更新工程、前沿方向与实践指南。

  - id: embodied
    name: 具身智能全景
    short: 具身智能
    category: 具身智能
    layer: 1
    order: 5
    prefixes: [embodied-ai-]
    desc: 9 讲。控制地基 → 学习范式（RL/IL/Sim2Real）→ 感知与操作 → VLA 基础模型 → 导航规划 → 数据仿真评测 → 产业版图。

  - id: flow
    name: Flow Matching
    short: Flow Matching
    category: 生成模型
    layer: 1
    order: 6
    prefixes: [flow-matching-]
    desc: 5 篇。原理篇（概率路径 / 连续性方程 / CFM 恒等式 / Score 与 Velocity 换算 / Fokker–Planck / CFG 倾斜分布）＋ 建模三讲（概率路径与边际向量场、score 与 SDE 扩展、条件生成与离散域潜空间）＋ 应用篇（SD3 到蛋白质设计）。

  - id: vae
    name: 变分自编码器与潜空间表示
    short: VAE 与潜空间
    category: 生成模型
    layer: 1
    order: 7
    prefixes: [vae-]
    desc: ELBO 的推导与紧度恒等式、重参数化技巧、高斯 KL 闭式解 → 模糊与后验坍塌的成因 → β-VAE / 层次 VAE / VQ-VAE / VQGAN 四条演进路线 → 连续 VAE 作为 Latent Diffusion 的压缩表示层。回答「潜空间凭什么能被采样、又为什么会失效」。

  - id: dit
    name: 扩散 Transformer
    short: DiT
    category: 生成模型
    layer: 1
    order: 8
    prefixes: [dit-]
    # exclude 必须有：前缀是子串匹配，rl-credit-assignment-* 里的 "credit-a" 会命中 "dit-"
    exclude: [credit-assignment]
    desc: 去噪函数的主干网络。Patchify 与 token 预算、AdaLN-Zero 的恒等初始化、ε/x₀/v 三种参数化的互换恒等式与误差放大、FLOPs 闭式记账与注意力二次项的临界 token 数、时间步的贝叶斯必要性、条件注入三条路径的表达力上限，到 PixArt / SD3 MMDiT / Flux / Sora 的演进。回答「把 U-Net 换成 Transformer 换来了什么」。

  - id: specdec
    name: 投机解码
    short: 投机解码
    category: 推理服务
    layer: 1
    order: 9
    prefixes: [specdec-]
    desc: 01 综述与演化 → 02 收益模型（α / γ / c 三个数决定加速比，天花板 1/(1-α) 与最优草稿长度）→ 03 EAGLE 家族（草稿从哪来的收敛史）→ 04 引擎支持矩阵 → 05 生产部署陷阱 → 06 业界实践 → 07 评测数字怎么读 → 08 未来方向。采样无偏性的证明归《PyTorch 采样实现深读》，本系列只讲收益与工程。

  # ---------- layer 2：前沿专题 ----------
  - id: rl-estimation
    name: RL 符号、估计量与信用分配
    short: 估计与信用分配
    category: 强化学习
    layer: 2
    order: 0
    prefixes: [rl-notation, rl-advantage, rl-credit-assignment]
    desc: 3 篇长文。符号对照（GAE、概率比、KL 的定义与实算）→ 优势估计的方法谱系（REINFORCE 到组相对基线与 2026 新形态）→ 信用分配与奖励系数的结算清单（2025–2026）。回答「同一个符号，各家文献与框架到底在算什么、差多少」。

  - id: agentic-rl
    name: Agentic RL：工具与搜索
    short: Agentic RL
    category: 强化学习
    layer: 2
    order: 1
    prefixes: [toolrl, search-rl]
    desc: 2 篇。动作空间从词表扩张到工具调用与搜索引擎之后的 RL：ToolRL 讲奖励为什么是工具学习的全部，Search RL 讲检索动作上的 credit assignment 与 rollout 成本控制。

  - id: reward-source
    name: 奖励从哪来：IRL 与自我改进
    short: 奖励的来源
    category: 强化学习
    layer: 2
    order: 2
    prefixes: [irl-, self-improving-reward]
    desc: 3 篇。示范反推奖励（逆强化学习五十年）→ IRL 在 LLM 对齐里的复活（奖励模型、DPO 与 RLVR 的关系）→ 模型给自己发奖励的第四象限（RLAIF、Constitutional AI、self-rewarding 与 reward hacking）。

  - id: rl-stack
    name: RL 训练栈：框架与源码
    short: RL 训练栈
    category: 强化学习
    layer: 2
    order: 3
    prefixes: [rl-training-frameworks, rl-variables, rl-frameworks]
    desc: 10 篇。源码级框架拆解（rl-frameworks 系列 8 篇：Megatron 训练栈 / slime / veRL / AReaL / RLinf / SGLang 接缝 / vLLM 接缝 / 两族横评与选型）+ 系统侧的框架横评（TRL / veRL / OpenRLHF / AReaL / slime 的设计取舍）+ 变量侧的源码对照（优势、概率比、KL 与损失聚合在各框架里怎么算）。承接 dist-train 的并行原理与 Megatron 的 refit / 权重同步。

  - id: wam
    name: 世界模型与世界动作模型
    short: 世界模型 WAM
    category: 具身智能
    layer: 2
    order: 4
    prefixes: [world-model]
    desc: 1 篇长文。从 Dreamer V4 到 Cosmos Policy / DreamZero 的 2025–2026 完整地图。

  - id: transcendental
    name: 超越函数与 softmax 的硬件实现
    short: 超越函数
    category: 芯片架构
    layer: 2
    order: 5
    prefixes: [gpu-transcendental]
    desc: 1 篇纵深长文。归约—逼近—重建三步算法、MUFU/SFU 的微架构选择、H100 上 989 vs 3.9 的吞吐悬崖，以及 FlashAttention-3 与 RoPE 长上下文的数值陷阱；含 5 组可复现实验。是 op 系列第 10 篇的续篇。

  # ---------- 单篇专题（只在分类面板出现） ----------
  - id: distill-rl
    name: 蒸馏 × RL 的统一损失光谱
    short: 统一光谱
    category: 强化学习
    node: false
    prefixes: [distill-rl-unified]
    desc: 1 篇。SFT、OPD、RLVR 是同一个损失的三次取值。同时收录在模型蒸馏系列的谱系尾端，是两个分类之间的桥梁篇。

  - id: xdsl
    name: xDSL 编译器体系
    short: xDSL
    category: 编译器技术
    node: false
    prefixes: [xdsl-compiler]
    desc: 纯 Python 重写的 MLIR 精神实现：IRDL、声明式装配格式与 PatternRewriteWalker。

  - id: profiling
    name: NVIDIA 性能剖析工具链（系列总纲）
    short: 工具总纲
    category: 性能分析
    node: false
    prefixes: [nv-gpu-profiling]
    desc: 从 nvidia-smi 到 Nsight Compute 的 profiling 工具全景，是性能剖析系列的入口总纲。

  - id: diffusion
    name: 扩散模型算法全景
    short: 扩散模型
    category: 深度学习
    node: false
    prefixes: [diffusion-survey]
    desc: 从噪声到数据：Diffusion 算法发展与应用全景。

  - id: diffusion-lm
    name: 扩散语言模型（dLLM）
    short: 扩散语言模型
    category: 生成模型
    layer: 2
    order: 6
    prefixes: [diffusion-lm-]
    desc: 离散扩散为主线。ELBO 如何化简成带 1/t 权重的掩码交叉熵 → 采样器与 remasking → 块扩散与 KV cache → 推理系统与加速 → 后训练与 RL → 2026 产业全景。回答「不做下一个 token 预测还能不能训出 LLM」。

  - id: flex-attention
    name: FlexAttention：注意力变体的编译器
    short: FlexAttention
    category: 编译器技术
    layer: 2
    order: 7
    prefixes: [flex-attention-]
    desc: 1 篇长文。score_mod / mask_mod 的可编程边界、online softmax 为什么能吃下任意逐点修正、BlockMask 的两笔账、反向如何用 joint graph 自动生成、PagedAttention 与 FlexDecoding，以及 2026 年 FA4 / Apple Silicon / 确定性反向三条新边界。回答「五花八门的注意力变体能不能只写几行 Python」。

  - id: sampling
    name: PyTorch 采样实现深读
    short: 采样实现
    category: 系统实现
    layer: 2
    order: 8
    prefixes: [pytorch-sampling-internals]
    desc: 1 篇长文。`torch.multinomial` 的 fast path 如何吃掉两种用法 → LLM 采样栈的 logits 塑形 → 投机解码里采样正确性变成一道数学题 → logprob 的五条路径为什么给出不同的数 → RL 里采样器与打分器的口径必须对齐 → 重参数化与 Gumbel-Softmax → VLA 的连续动作 → RNG 与确定性复现。回答「同一个 logprob，为什么五个地方算出来不一样」。

  - id: python-runtime
    name: Python 运行时与图捕获
    short: Python 运行时
    category: 系统实现
    layer: 2
    order: 9
    prefixes: [python-runtime-]
    desc: 1 篇长文。编译流水线（源码 → AST → 符号表 → Code Object → 字节码）→ 编译期作用域分类如何决定运行时的 LOAD_FAST / LOAD_GLOBAL / LOAD_DEREF / LOAD_NAME → 编译期常量折叠与运行时自适应专门化（PEP 659）的分野 → Code Object 静态复用与 Frame 动态独立 → 求值栈与生成器 frame 的保留 → PEP 523 的 Frame Evaluation Hook 与 sys.settrace / sys.monitoring 的能力边界 → TorchDynamo 的字节码符号执行、FX Graph、Graph Break 与 Guard。回答「torch.compile 是从哪里拿到它要编译的东西的」。

  - id: agent-anatomy
    name: Agent 技术剖析
    short: Agent 技术剖析
    category: Agent技术剖析
    layer: 2
    order: 10
    prefixes: [agent-anatomy-]
    desc: 2 篇。先看形态：七个 coding agent（OpenCode / Hermes / WorkBuddy / Codex CLI / Pi / Claude Code / DSH）的五类持久状态、四种存储选择、会话树的三种表示、压缩的三种持久化。再算成本：`dbstat` 逐表拆解 1.3 GB 到底装了什么、`EXPLAIN QUERY PLAN` 验证每个索引是否兑现、全文索引为何要付近 3 倍空间。回答「agent 该写什么、写到哪、这笔钱花得值不值」。

