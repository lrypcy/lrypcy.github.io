paths:
  - name: AI Infra 工程师主线
    desc: 先懂硬件，再懂编译与算子，接着学会度量与归因，然后落到训练系统与量化，最后走到推理引擎与投机解码
    steps: [chip, compiler, op, dist-train, perf-analysis, quant, serving, specdec]
  - name: 大模型算法与后训练
    desc: 位置编码打底 → 策略优化 → 蒸馏与量化，覆盖 post-training 全链路
    steps: [posem, mdp-grpo, distill, quant]
  - name: 具身智能与世界模型
    desc: 硬件与算子打底 → 具身全景 → 世界模型这条 2025–2026 新主线
    steps: [chip, op, embodied, wam]
  - name: 生成模型与扩散
    desc: 潜空间表示打底 → 扩散全景到 Flow Matching → 去噪函数的主干架构，再到生成式策略与世界模型
    steps: [vae, flow, dit, wam]
  - name: Agent 实现阅读
    desc: 从 Python 运行时这类「底座实现」读起，再进入 agent 自身的状态与存储设计
    steps: [python-runtime, agent-anatomy]
