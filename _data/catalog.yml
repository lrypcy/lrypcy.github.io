# 左侧目录（全站目录 rail）的分类分层
#
# 只决定「分类按什么顺序出现」，不重复维护文章列表：
#   · 分类下的系列划分沿用 _data/knowledge_graph.yml 的 series.prefixes（文件名前缀匹配）
#   · 系列内按发布日期升序，即写作/阅读顺序
#   · 没匹配到任何系列的文章进「散篇」
#
# 分层依据：典型 AI-Infra 栈，自底向上——
#   算力底座（芯片 → 算子 → 编译）→ 训练系统（并行 → 剖析 → 运行时）
#   → 压缩与部署（量化 / 蒸馏）→ 推理与服务（引擎 · 调度 · 投机解码）
#   → 模型与算法 → 前沿应用
#
# 新增分类忘了写进来？不会丢：未列出的分类自动追加到末尾的「其他分类」一节。

sections:
  - name: 算力底座
    hint: 芯片 · 算子 · 编译
    categories:
      - 芯片架构
      - 算子开发
      - 编译器技术

  - name: 训练系统
    hint: 并行 · 剖析 · 运行时
    categories:
      - 分布式训练
      - 性能分析
      - 系统实现

  - name: 压缩与部署
    hint: 量化 · 蒸馏
    categories:
      - 模型量化
      - 模型蒸馏

  - name: 推理与服务
    hint: 引擎 · 调度 · 投机解码
    categories:
      - 推理服务

  - name: 模型与算法
    hint: 表示 · 位置 · 策略
    categories:
      - 深度学习
      - LLM算法
      - 强化学习
      - 生成模型

  - name: 前沿应用
    hint: 具身与世界模型
    categories:
      - 具身智能

  - name: Agent 工程
    hint: 存储 · 上下文 · 工具
    categories:
      - Agent技术剖析
